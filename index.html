<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#06070e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Gravity Flip 3D</title>
    <!-- Space Grotesk — technical, clean, modern -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <!-- ════════════════════════════════════════════════════════════════
         SPLASH / LOADING SCREEN
         ════════════════════════════════════════════════════════════════ -->
    <div id="splash-screen" aria-hidden="true">
      <div class="splash-inner">
        <img src="/logo.png" alt="Gravity Flip 3D" class="splash-logo" draggable="false" />
        <div class="splash-dots" aria-hidden="true">
          <span></span><span></span><span></span>
        </div>
      </div>
    </div>

    <!-- 3D canvas mounts here -->
    <div id="app"></div>

    <!-- ── Floating physics equations (always visible, mix-blend-mode) ── -->
    <div id="physics-equations" aria-hidden="true"></div>

    <!-- ════════════════════════════════════════════════════════════════
         CONTROL MODE PICKER  (shown on first mobile launch)
         ════════════════════════════════════════════════════════════════ -->
    <div id="control-picker" class="hidden" role="dialog" aria-modal="true" aria-label="Choose controls">
      <div class="cp-card">

        <h2 class="cp-title" data-i18n-html="cpTitle">HOW DO YOU<br>WANT TO PLAY?</h2>
        <p class="cp-sub" data-i18n="cpSub">Gravity is in your hands — literally</p>

        <div class="cp-options">

          <!-- ── TOUCH D-PAD ── -->
          <button class="cp-option" id="cp-touch-btn" data-mode="touch">
            <div class="cp-preview" aria-hidden="true">
              <div class="cp-dpad">
                <div class="cp-dpad-btn cp-dpad-up">
                  <svg viewBox="0 0 24 24" fill="none"><path d="M6 15l6-6 6 6" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </div>
                <div class="cp-dpad-row">
                  <div class="cp-dpad-btn cp-dpad-left">
                    <svg viewBox="0 0 24 24" fill="none"><path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                  </div>
                  <div class="cp-dpad-center"></div>
                  <div class="cp-dpad-btn cp-dpad-right">
                    <svg viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                  </div>
                </div>
                <div class="cp-dpad-btn cp-dpad-down">
                  <svg viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </div>
              </div>
            </div>
            <span class="cp-opt-name" data-i18n="cpDpadName">D‑PAD</span>
            <span class="cp-opt-desc" data-i18n="cpDpadDesc">Tap arrows to flip gravity</span>
            <div class="cp-badge cp-badge-classic" data-i18n="cpBadgeClassic">CLASSIC</div>
          </button>

          <!-- ── GYROSCOPE ── -->
          <button class="cp-option cp-option-gyro" id="cp-gyro-btn" data-mode="sensor">
            <div class="cp-preview" aria-hidden="true">
              <div class="cp-gyro-wrap">
                <div class="cp-phone">
                  <div class="cp-phone-notch"></div>
                  <div class="cp-phone-screen">
                    <div class="cp-phone-arrow">↓</div>
                  </div>
                </div>
                <div class="cp-gyro-orbit">
                  <div class="cp-gyro-dot"></div>
                </div>
              </div>
            </div>
            <span class="cp-opt-name" data-i18n="cpGyroName">GYROSCOPE</span>
            <span class="cp-opt-desc" data-i18n="cpGyroDesc">Tilt device to flip gravity</span>
            <div class="cp-badge cp-badge-new" data-i18n="cpBadgeNew">NEW</div>
          </button>

        </div>

        <!-- Gyro error / not-available message -->
        <p id="cp-gyro-error" class="cp-gyro-error" style="display:none"></p>

        <!-- Remember toggle -->
        <label class="cp-remember">
          <div class="cp-toggle-wrap">
            <input type="checkbox" id="cp-remember" checked />
            <div class="cp-toggle-track">
              <div class="cp-toggle-thumb"></div>
            </div>
          </div>
          <span data-i18n="cpRemember">Remember my choice</span>
        </label>

        <p class="cp-footer" data-i18n="cpFooter">You can always reset in Settings → clear site data</p>
      </div>
    </div>

    <!-- ════════════════════════════════════════════════════════════════
         SENSOR MODE BADGE  (shown in-game when gyro is active)
         ════════════════════════════════════════════════════════════════ -->
    <div id="sensor-badge" class="hidden" aria-label="Gyroscope active">
      <div class="sb-ring" aria-hidden="true"></div>
      <div class="sb-content">
        <span class="sb-icon" aria-hidden="true">◉</span>
        <span class="sb-label">GYRO</span>
      </div>
      <button id="sb-calibrate" class="sb-action" title="Tap to recalibrate" aria-label="Recalibrate sensor">
        <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
          <circle cx="10" cy="10" r="3.5" stroke="currentColor" stroke-width="1.6"/>
          <path d="M10 2.5v2M10 15.5v2M2.5 10h2M15.5 10h2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
        <span>CAL</span>
      </button>
      <button id="sb-switch" class="sb-action sb-action-switch" title="Switch to touch controls" aria-label="Switch to touch controls">
        <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
          <rect x="3" y="3" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.5"/>
          <rect x="11" y="3" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.5"/>
          <rect x="3" y="11" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.5"/>
          <rect x="11" y="11" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.5"/>
        </svg>
        <span>D-PAD</span>
      </button>
    </div>
    <div id="auth-overlay" role="dialog" aria-modal="true" aria-label="Sign in">

      <div class="auth-card">
        <!-- Logo -->
        <div class="auth-logo">
          <span class="auth-logo-icon" aria-hidden="true">⊗</span>
          <span class="auth-logo-text">GRAVITY FLIP</span>
        </div>
        <p class="auth-tagline" data-i18n="authTagline">Master the physics of gravity</p>

        <!-- Tabs -->
        <div class="auth-tabs" role="tablist">
          <button class="auth-tab active" data-tab="login"    role="tab" aria-selected="true"  data-i18n="tabLogin">Login</button>
          <button class="auth-tab"        data-tab="register" role="tab" aria-selected="false" data-i18n="tabRegister">Register</button>
        </div>

        <!-- Login form -->
        <form id="login-form" class="auth-form" autocomplete="on" method="post">
          <div class="field-group">
            <input id="login-username" type="text"     name="username" placeholder="Username"
                   autocomplete="username" minlength="3" maxlength="20" required
                   data-i18n-ph="phUsername" />
          </div>
          <div class="field-group">
            <input id="login-password" type="password" name="password" placeholder="Password"
                   autocomplete="current-password" minlength="6" required
                   data-i18n-ph="phPassword" />
          </div>
          <p class="auth-error" id="login-error" role="alert"></p>
          <button type="submit" class="auth-submit" data-i18n="btnLogin">LOGIN</button>
        </form>

        <!-- Register form (hidden by default) -->
        <form id="register-form" class="auth-form hidden" autocomplete="on" method="post">
          <div class="field-group">
            <input id="reg-username" type="text"     name="username" placeholder="Choose username"
                   autocomplete="username" minlength="3" maxlength="20"
                   pattern="[a-zA-Z0-9_]+" title="Letters, numbers and underscores only" required
                   data-i18n-ph="phChooseUsername" />
          </div>
          <div class="field-group">
            <input id="reg-password" type="password" name="password" placeholder="Create password"
                   autocomplete="new-password" minlength="6" required
                   data-i18n-ph="phCreatePassword" />
          </div>
          <p class="auth-error" id="reg-error" role="alert"></p>
          <button type="submit" class="auth-submit" data-i18n="btnCreateAccount">CREATE ACCOUNT</button>
        </form>

        <!-- Guest option -->
        <div class="auth-divider"><span data-i18n="authOr">or</span></div>
        <button id="guest-btn" class="guest-play" type="button" data-i18n="btnGuest">Play as Guest</button>

        <!-- Language toggle -->
        <div class="auth-lang-row">
          <button class="lang-btn" id="lang-btn-auth" aria-label="Switch language">
            <span class="lang-switch-label">TR</span>
          </button>
        </div>
      </div>
    </div>

    <!-- ════════════════════════════════════════════════════════════════
         LEADERBOARD OVERLAY
         ════════════════════════════════════════════════════════════════ -->
    <div id="leaderboard-overlay" class="hidden" role="dialog" aria-modal="true" aria-label="Leaderboard">
      <div class="lb-card">
        <button id="lb-close" class="lb-close" aria-label="Close leaderboard">✕</button>
        <h2 class="lb-title">
          <span class="lb-title-icon" aria-hidden="true">🏆</span>
          <span data-i18n="lbTitle">LEADERBOARD</span>
        </h2>
        <div class="lb-header-row">
          <span data-i18n="lbHdrRank">RANK</span><span data-i18n="lbHdrPlayer">PLAYER</span><span data-i18n="lbHdrLevels">LEVELS</span><span data-i18n="lbHdrFlips">FLIPS</span>
        </div>
        <div id="lb-list"></div>
      </div>
    </div>

    <!-- ════════════════════════════════════════════════════════════════
         HUD  (shown during gameplay)
         ════════════════════════════════════════════════════════════════ -->
    <header id="hud">
      <!-- Level pill -->
      <div id="hud-level-pill">
        <span class="pill-accent" id="hud-level">01</span>
        <div class="pill-divider"></div>
        <span class="pill-label" id="hud-level-name">First Steps</span>
      </div>

      <!-- Flips pill -->
      <div id="hud-flips-pill">
        <svg class="pill-icon" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M10 3C6.13 3 3 6.13 3 10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          <path d="M10 17C13.87 17 17 13.87 17 10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          <path d="M10 3L7.5 5.5M10 3L12.5 5.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M10 17L12.5 14.5M10 17L7.5 14.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="pill-accent" id="hud-flips">0</span>
        <span class="pill-par">/<span id="hud-par">1</span></span>
      </div>

      <!-- User + Leaderboard pill -->
      <div id="hud-right-pill">
        <button id="lang-btn" class="lb-hud-btn lang-btn" aria-label="Switch language" title="Language">
          <span class="lang-switch-label">TR</span>
        </button>
        <span id="hud-user" class="pill-label">GUEST</span>
        <button id="logout-btn" class="lb-hud-btn logout-btn hidden" aria-label="Logout" title="Logout">
          <svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M7 3H4a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
            <path d="M13 14l3-4-3-4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M16 10H8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
          </svg>
        </button>
        <button id="ctrl-btn" class="lb-hud-btn" aria-label="Change controls" title="Change controls">
          <svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <circle cx="10" cy="10" r="2.8" stroke="currentColor" stroke-width="1.8"></circle>
            <path d="M10 1.5v1.8M10 16.7v1.8M1.5 10h1.8M16.7 10h1.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></path>
            <path d="M8.65 1.6 8 3.3A6.1 6.1 0 0 0 6.2 4.2L4.4 3.7l-1.7 3 1.4 1.2a6.2 6.2 0 0 0 0 2.2L2.7 11.3l1.7 3 1.8-.5a6.1 6.1 0 0 0 1.8.9l.65 1.7h3.4l.65-1.7a6.1 6.1 0 0 0 1.8-.9l1.8.5 1.7-3-1.4-1.2a6.2 6.2 0 0 0 0-2.2l1.4-1.2-1.7-3-1.8.5A6.1 6.1 0 0 0 12 4.2l-.65-1.7Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"></path>
          </svg>
        </button>
        <button id="lb-btn" class="lb-hud-btn hidden" aria-label="Show leaderboard" title="Leaderboard">
          <svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <rect x="2"  y="10" width="4" height="8" rx="1" fill="currentColor" opacity=".6"/>
            <rect x="8"  y="6"  width="4" height="12" rx="1" fill="currentColor" opacity=".8"/>
            <rect x="14" y="2"  width="4" height="16" rx="1" fill="currentColor"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- ── 4-Direction gravity indicators ─────── -->
    <div id="gravity-dirs" aria-hidden="true">
      <div class="gdir gdir-up" id="gdir-up">
        <svg class="gdir-arrow-svg" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="gdir-label" data-i18n="gravityUp">YUKARI</span>
      </div>
      <div class="gdir gdir-down" id="gdir-down">
        <svg class="gdir-arrow-svg" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 5v14M19 12l-7 7-7-7" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="gdir-label" data-i18n="gravityDown">AŞAĞI</span>
      </div>
      <div class="gdir gdir-left" id="gdir-left">
        <svg class="gdir-arrow-svg" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="gdir-label" data-i18n="gravityLeft">SOL</span>
      </div>
      <div class="gdir gdir-right" id="gdir-right">
        <svg class="gdir-arrow-svg" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12h14M12 5l7 7-7 7" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="gdir-label" data-i18n="gravityRight">SAĞ</span>
      </div>
    </div>

    <!-- ── Center message overlay ────────────────── -->
    <div id="hud-message" aria-live="polite">
      <div id="msg-icon"></div>
      <div id="msg-title"></div>
      <div id="msg-sub"></div>
    </div>

    <!-- ── Touch D-pad (bottom-center) ───────────── -->
    <nav id="touch-controls" aria-label="Gravity controls">
      <button class="tc-btn" data-dir="up" aria-label="Flip gravity up">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 15l6-6 6 6" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="tc-row">
        <button class="tc-btn" data-dir="left" aria-label="Flip gravity left">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="tc-center" aria-hidden="true"></div>
        <button class="tc-btn" data-dir="right" aria-label="Flip gravity right">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <button class="tc-btn" data-dir="down" aria-label="Flip gravity down">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </nav>

    <script type="module" src="/src/main.ts"></script>

    <!-- ── Update toast ─────────────────────────────────────── -->
    <div id="update-toast" class="update-toast" role="status" aria-live="polite">
      <span class="update-toast-msg" data-i18n="updateMsg">🔄 New version available</span>
      <button id="update-reload" class="update-toast-btn" data-i18n="updateReload">Reload</button>
      <button id="update-dismiss" class="update-toast-dismiss" aria-label="Dismiss">✕</button>
    </div>

    <!-- ── Service Worker registration ─────────────────────── -->
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js');
      }
    </script>
  </body>
</html>
